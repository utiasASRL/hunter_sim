## Online Lidar VTR3
session_name: vtr_simulated_lidar_hunter

# environment:
#   ROS_DOMAIN_ID: "7"   # set this to a unique number when multiple ROS2 dependent system running on the same network
#   ROS_DISCOVERY_SERVER: "192.168.131.1:11811;192.168.131.100:11811"

start_directory: ${VTRTEMP}
suppress_history: false

windows:
  - window_name: vtr_navigation_system
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - ros2 run vtr_gui setup_server  --ros-args -r __ns:=/vtr
    panes:
      - >
        ROBOT_NAME=leader ros2 launch vtr_navigation vtr_sim.launch.py
        base_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/lidar_hunter_leader.yaml
        start_new_graph:=false
        use_sim_time:=false
        graph_dir:=${VTRTEMP}/sim_mars_dome_convoy
        planner:="unicycle_mpc"
        model_dir:=${VTRROOT}/models
        

  - window_name: vtr_gui
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - ros2 run vtr_gui socket_client  --ros-args -r __ns:=/vtr
      - ros2 run vtr_gui socket_server  --ros-args -r __ns:=/vtr
      - ros2 run vtr_gui web_server  --ros-args -r __ns:=/vtr
      # - firefox --new-window "localhost:5200" # the webpage has to wait for everything above

  - window_name: rviz2
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - ros2 run rviz2 rviz2 -d ${VTRSRC}/rviz/ouster.rviz
  
  - window_name: command_mapper_nodes
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - source ${VTRROOT}/hunter_sim/install/setup.bash
    panes:
      - >
        ros2 run vtr_hunter command_mapper
        --ros-args
        -r cmd_vel:=/robot1/cmd_vel
        -r wheel_velocity:=/robot1/wheel_velocity
        -r steer_angle:=/robot1/steer_angle
