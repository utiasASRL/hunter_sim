## Online Lidar VTR3
session_name: vtr_simulated_lidar_hunter_convoy


start_directory: ${VTRTEMP}
suppress_history: false

windows:
  - window_name: command_line_interface
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - source ${VTRROOT}/hunter_sim/install/setup.bash
    panes:
      - ros2 run vtr_hunter start_convoy_repeat_three && ros2 topic echo /leader/vtr/mpc_prediction
      #- cd $VTRDATA/gazebo_convoy && ros2 bag record /robot1/cmd_vel /robot2/cmd_vel /robot3/cmd_vel /leader/vtr/mpc_prediction /leader/vtr/odometry /follower/vtr/mpc_prediction /follower/vtr/odometry /follower_2/vtr/mpc_prediction /follower_2/vtr/odometry

  - window_name: leader_vtr_navigation_system
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - >
        ROBOT_NAME=leader ros2 launch vtr_navigation vtr_sim.launch.py
        base_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/lidar_hunter.yaml
        start_new_graph:=false
        use_sim_time:=true
        data_dir:=${VTRTEMP}/sim_mars_dome_convoy
        planner:="bicycle_mpc"
        model_dir:=${VTRROOT}/models

  - window_name: follower_vtr_navigation_system
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - >
        ROBOT_NAME=follower ros2 launch vtr_navigation vtr_sim.launch.py
        base_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/lidar_hunter.yaml
        start_new_graph:=false
        use_sim_time:=true
        data_dir:=${VTRTEMP}/sim_mars_dome_convoy_2
        planner:="bicycle_mpc_follower"
        override_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/follower_params.yaml
        model_dir:=${VTRROOT}/models
        
  - window_name: follower_2_vtr_navigation_system
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - >
        ROBOT_NAME=follower_2 ros2 launch vtr_navigation vtr_sim.launch.py
        base_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/lidar_hunter.yaml
        start_new_graph:=false
        use_sim_time:=true
        data_dir:=${VTRTEMP}/sim_mars_dome_convoy_3
        planner:="bicycle_mpc_follower"
        override_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/follower_params_2.yaml
        model_dir:=${VTRROOT}/models
    
  - window_name: command_mapper
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - source ${VTRROOT}/hunter_sim/install/setup.bash
    panes:
      - >
        ros2 run vtr_hunter command_mapper
        --ros-args
        -r cmd_vel:=/robot1/cmd_vel
        -r wheel_velocity:=/robot1/wheel_velocity
        -r steer_angle:=/robot1/steer_angle
      - >
        ros2 run vtr_hunter command_mapper
        --ros-args
        -r cmd_vel:=/robot2/cmd_vel
        -r wheel_velocity:=/robot2/wheel_velocity
        -r steer_angle:=/robot2/steer_angle
      - >
        ros2 run vtr_hunter command_mapper
        --ros-args
        -r cmd_vel:=/robot3/cmd_vel
        -r wheel_velocity:=/robot3/wheel_velocity
        -r steer_angle:=/robot3/steer_angle

  # - window_name: vtr_gui
  #   layout: main-horizontal
  #   shell_command_before:
  #     - source ${VTRSRC}/main/install/setup.bash
  #   panes:
  #     - ros2 run vtr_gui socket_client  --ros-args -r __ns:=/vtr_follower
  #     - ros2 run vtr_gui socket_server  --ros-args -r __ns:=/vtr_follower
  #     - ros2 run vtr_gui web_server  --ros-args -r __ns:=/vtr_follower
      # - firefox --new-window "localhost:5200" # the webpage has to wait for everything above
  - window_name: rviz2
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - ros2 run rviz2 rviz2 -d ${VTRSRC}/rviz/ouster.rviz

