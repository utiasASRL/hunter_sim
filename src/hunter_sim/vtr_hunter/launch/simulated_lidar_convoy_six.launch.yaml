## Online Lidar VTR3
session_name: vtr_simulated_lidar_hunter_convoy


start_directory: ${VTRTEMP}
suppress_history: false

windows:
  - window_name: start_repeat
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - source ${VTRROOT}/hunter_sim/install/setup.bash
    panes:
      - ros2 run vtr_hunter start_convoy_repeat --ros-args -p num_robots:=6
      # - cd $VTRDATA/gazebo_convoy && ros2 bag record /robot1/cmd_vel /robot2/cmd_vel /robot3/cmd_vel /robot4/cmd_vel /robot5/cmd_vel /robot6/cmd_vel /robot1/gz_odometry /robot2/gz_odometry /robot3/gz_odometry /robot4/gz_odometry /robot5/gz_odometry /robot6/gz_odometry
  
  - window_name: leader_vtr_navigation_system
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - >
        ROBOT_NAME=robot0 ros2 launch vtr_navigation vtr_sim.launch.py
        base_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/lidar_hunter.yaml
        override_params:=${VTRROOT}/hunter_sim/src/hunter_sim/vtr_hunter/config/convoy_6.yaml
        start_new_graph:=false
        use_sim_time:=true
        data_dir:=${VTRTEMP}/hunter_sim/dome_teach_new/robot0
        command_topic:=/robot0/cmd_vel
        planner:=dynamic_path_planner
        model_dir:=${VTRROOT}/models

